services:
  - type: web
    name: cepa-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: BACKEND_ENV
        value: production
      - key: ACTIVE_GRADING_POLICY
        value: DEMO_ASSUMPTION_v1
      # Explicit container storage directory matching non-root appuser ownership (/app/storage)
      - key: STORAGE_DIR
        value: "/app/storage"
      # Production CORS origins including live PoC domains and local dev
      - key: CORS_ORIGINS
        value: "https://cepa-app.vercel.app,https://cepa-nine.vercel.app,http://localhost:8081,http://localhost:3000,http://localhost:8000,http://localhost:8001"
      # Service URLs
      - key: REPORT_BASE_URL
        value: "https://cepa-backend.onrender.com"
      - key: SHARE_LINK_BASE_URL
        value: "https://cepa-backend.onrender.com/api/v1/reports/share"
      # Authentication and Sovereign Cryptographic Seal (separated keys)
      # ENFORCE_OFFICER_AUTH=false enables frictionless hackathon evaluation; enable for enterprise deployment
      - key: ENFORCE_OFFICER_AUTH
        value: "false"
      - key: OFFICER_API_KEY
        sync: false
      - key: HMAC_SEAL_SECRET_KEY
        generateValue: true
      # Active Multimodal Groq AI Models
      - key: GROQ_VISION_MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_TEXT_MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_API_KEY
        sync: false
      - key: DEF_USE_MOCK
        value: "false"
