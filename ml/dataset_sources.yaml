sources:
  - name: "Mendeley Data: Red and White Onion Bulbs and Leaves"
    url: "https://data.mendeley.com/datasets/42bcyncfhy/2"
    doi: "10.17632/42bcyncfhy.2"
    license: "CC BY 4.0"
    download_status: "pending"
    total_images: 16300
    usable_images: 0
    classes: ["healthy", "unhealthy"]
    mapping:
      healthy: "GOOD"
      unhealthy: "UNHEALTHY_AUXILIARY"
    excluded_classes: ["leaves"]
    reason_for_exclusion: "Leaves are irrelevant to bulb quality classification."

  - name: "Harvard Dataverse: Good Onion"
    url: "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/ZNPAC8"
    doi: "10.7910/DVN/ZNPAC8"
    license: "CC0 1.0 Universal"
    download_status: "pending"
    total_images: 0
    usable_images: 0
    classes: ["good"]
    mapping:
      good: "GOOD"
    excluded_classes: []
    reason_for_exclusion: ""

  - name: "Roboflow: OnionSpoilageDetection"
    url: "https://universe.roboflow.com/search?q=OnionSpoilageDetection"
    doi: ""
    license: "Unknown"
    download_status: "pending"
    total_images: 1690
    usable_images: 0
    classes: ["healthy", "mold", "rotten", "sprouted"]
    mapping:
      healthy: "GOOD"
      mold: "ROTTEN" # Documented visual-quality semantics for spoilage
      rotten: "ROTTEN"
      sprouted: "SPROUTED"
    excluded_classes: []
    reason_for_exclusion: ""

  - name: "Roboflow: onions-quality-analysis"
    url: "https://universe.roboflow.com/chandrajith-j/onions-quality-analysis"
    doi: ""
    license: "CC BY 4.0"
    download_status: "pending"
    total_images: 209
    usable_images: 0
    classes: ["Healthy", "Damaged", "Rotten", "Sprouted", "Onions-Quality-Analysis"]
    mapping:
      Healthy: "GOOD"
      Damaged: "DAMAGED"
      Rotten: "ROTTEN"
      Sprouted: "SPROUTED"
    excluded_classes: ["Onions-Quality-Analysis"]
    reason_for_exclusion: "Ambiguous class name not aligning with standard quality semantics."
