# Cepa Grading Policy -- BIS IS 17912:2022 / APMC commercial practice
# Guidelines for Supply Chain of Fresh Onions (Allium cepa L.)
#
# NOTE: IS 17912:2022 (Bureau of Indian Standards) is a supply-chain logistics
# specification, not a dimensional grading standard with 45-75mm windows.
# The size thresholds below are working assumptions aligned with observed APMC
# commercial practice and NAFED Market Intervention Scheme descriptions, and are
# pending verification against the actual NAFED/NCCF procurement EOI document.
# Do NOT claim these are certified BIS grading thresholds.

version: "BIS_IS_17912_2022"
label: "APMC Commercial Grade (working thresholds -- pending NAFED EOI verification)"
source_note: >
  Working assumptions based on APMC-observed commercial practice.
  IS 17912:2022 covers supply-chain logistics for onions, not dimensional grading windows.
  Thresholds pending official NAFED/NCCF EOI document confirmation.
verified: false  # IS 17912 is a supply-chain spec, not a grading standard
created: "2026-09-28"

# Whether URS / Grade B specifications are active for commercial lots
urs_active: true

# ── Size thresholds (equatorial diameter in mm) ───────────────────────────────
size:
  # Grade A (Prime Mandi Lot): Standard commercial range
  grade_a_min_mm: 45.0
  grade_a_max_mm: 75.0
  # URS / Grade B: Permissible market range
  urs_min_mm: 35.0
  urs_max_mm: 85.0

# ── Defect probability thresholds ────────────────────────────────────────────
defect_thresholds:
  damaged_threshold: 0.70
  rotten_threshold: 0.45
  sprouted_threshold: 0.45

# ── Hard rejection rules (apply unconditionally) ──────────────────────────────
hard_rejection:
  rotten_always_rejected: true
  sprouted_always_rejected: true
  below_urs_min_always_rejected: true   # < 35mm pinhead/waste rejected
  above_urs_max_always_rejected: true   # > 85mm bolter/coarse rejected

# ── Grade A qualification criteria ───────────────────────────────────────────
grade_a_rules:
  size_range: grade_a      # 45mm – 75mm
  rotten: false
  sprouted: false
  damaged: false

# ── URS qualification criteria ────────────────────────────────────────────────
urs_rules:
  size_range: urs          # 35mm – 85mm
  rotten: false
  sprouted: false
  damaged: true            # superficial dry peeling / abrasions accepted

# ── Confidence tier boundary values ──────────────────────────────────────────
review_thresholds:
  size_tolerance_mm: 2.5
  defect_prob_range: [0.35, 0.60]

# ── Rejection reason codes ────────────────────────────────────────────────────
rejection_reason_codes:
  - ROTTEN
  - SPROUTED
  - UNDERSIZED
  - OVERSIZED
  - DAMAGED_GRADE_A
  - URS_INACTIVE
  - FAILED_ALL_GRADES
  - SIZE_UNKNOWN
  - CONFIDENCE_UNUSABLE
  - INTERNAL_ROT_SUSPECT
